subjects_intro: Taught at all levels throughout the school year.
subjects:
  - title: Alphabet & Reading
    text: From first letters to confident reading of Greek words and stories.
    icon: book
  - title: Writing & Grammar
    text: Building strong writing skills and an understanding of Greek grammar.
    icon: pen
  - title: Conversation & Vocabulary
    text: Speaking practice through everyday conversations, plus the words and expressions to talk in Greek with family and friends.
    icon: chat
  - title: Faith & Traditions
    text: Religious and cultural traditions of the Greek Orthodox Church.
    icon: cross
  - title: History
    text: Lessons on Greek history and the stories of our ancestors.
    icon: temple
  - title: Programs
    text: Students perform at the OXI Day, Christmas and March 25th programs.
    icon: star
resources_intro: In class and at home, our students learn with the books and online platforms of two trusted Greek-language programs.
resources:
  - title: Greek123
    text: A proven step-by-step method to Greek fluency, combining books with a digital learning platform.
    link: https://www.greek123.com
    link_label: Visit greek123.com
  - title: Ellinopoula
    text: An e-learning platform that makes Greek exciting for kids with interactive lessons, games, videos and culture.
    link: https://www.ellinopoula.com
    link_label: Visit ellinopoula.com
