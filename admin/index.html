<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Website editor | St. George Greek School</title>
<!-- /admin opens the Pages CMS editor for this website (sign-in happens there). -->
<meta http-equiv="refresh" content="0; url=https://app.pagescms.org/panpapadopoulos/GreeKschool/main">
<link rel="icon" href="/images/logo.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9f1f8; color: #22303f; font: 16px/1.6 "Open Sans", system-ui, sans-serif; text-align: center; padding: 16px; }
  main { background: #fff; border-radius: 12px; padding: 32px 28px; max-width: 420px; box-shadow: 0 6px 20px rgba(29,63,122,.08); }
  img { width: 72px; height: 72px; }
  h1 { font-family: "Libre Baskerville", Georgia, serif; color: #1d3f7a; font-size: 1.3rem; margin: 12px 0 6px; }
  a { display: inline-block; margin-top: 14px; background: #2a6aa0; color: #fff; padding: 11px 22px; border-radius: 999px; font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid #c9a227; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/images/logo.png" alt="">
  <h1>Opening the website editor…</h1>
  <p>If nothing happens, use the button below.</p>
  <a href="https://app.pagescms.org/panpapadopoulos/GreeKschool/main">Open the editor</a>
</main>
<script>location.replace('https://app.pagescms.org/panpapadopoulos/GreeKschool/main');</script>
</body>
</html>
